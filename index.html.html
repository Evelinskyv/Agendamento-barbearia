<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro VIP</title>

    <style>
        body {
            margin: 6;
            padding: 10;
            font-family: Arial;
            background: linear-gradient(to bottom right, #e92171, #ecdde8);
        }

        h2, h3 {
            text-align: center;
            color: white;
            text-shadow: 1px 1px 3px #00000060;
        }

        .container {
            max-width: 550px;
            margin: 36px auto;
            background: #ffe6f9;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 12px #00000040;
            padding: 10px auto;
        }

        label {
            font-weight: bold;
            color: #36272d;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid #f588bb;
            font-size: 16px;
            outline: none;
            background: linear-gradient(to right, #ffffff, #ffe6f2);
            transition: 0.3s;
            box-shadow: 0 0 10px #00000020;
        }

        input:focus, textarea:focus {
            border-color: #ff4da6;
            box-shadow: 0 0 16px #ff4da670;
        }

        button {
            padding: 12px 20px;
            background: #ff6699;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        button:hover {
            background: #ff3377;
        }
    </style>
</head>

<body>

<h2>PREENCHA E ENTRE NA LISTA VIP!</h2>

<div class="container">
    <h3>REALIZE SEU CADASTRO</h3>

    <form>
        <label>NOME COMPLETO</label>
        <input type="text" name="NOME" placeholder="DIGITE SEU NOME...">

        <label>DATA DE NASCIMENTO</label>
        <input type="date" name="DATA">

        <label>E-MAIL</label>
        <input type="email" name="EMAIL" placeholder="DIGITE SEU E-MAIL...">

        <label>TELEFONE</label>
        <input type="tel" name="TELEFONE" placeholder="DIGITE SEU TELEFONE...">

        <label>ENDEREÇO</label>
        <input type="text" name="ENDERECO" placeholder="ENDEREÇO COMPLETO">

        <label>O QUE TE FAZ QUERER SER NOSSO CLIENTE VIP?</label>
        <textarea rows="5" placeholder="CONTE-NOS"></textarea>

        <button type="submit">ENVIAR</button>
    </form>
</div>

</body>
</html>
